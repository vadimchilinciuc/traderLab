[project]
name = "traderlab"
version = "0.0.1"
description = "Trader Lab — cantiere Fase 0: contratti, tool server, ledger, arena repliche (solo shadow)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "toolserver", "ledger", "arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]
